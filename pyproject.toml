[project]
name = "ff-assistant"
version = "0.1.0"
description = "A fantasy football assistant that makes use of Sleeper API."
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.3,<3",
    "loguru>=0.7,<1",
    "nflreadpy>=0.1.5",
    "python-dotenv>=1,<2",
]

[project.scripts]
ff-assistant = "ff_assistant.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "ruff",
    "mypy"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
extend-select = ["E501"]
